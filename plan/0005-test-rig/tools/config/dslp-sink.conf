# dslp-sink: experiment container, relay forward target + reply path
# Mirrors the lxc-download archlinux pattern used for api.d07yx58.net.

lxc.include = /usr/share/lxc/config/common.conf
lxc.arch = x86_64

# Container specific configuration
lxc.rootfs.path = dir:/mnt/nvme/lxc/dslp-sink/rootfs
lxc.uts.name = dslp-sink

# Network configuration
lxc.net.0.type = veth
lxc.net.0.link = br-lan
lxc.net.0.flags = up
lxc.net.0.hwaddr = 10:66:6a:00:00:12
lxc.start.auto = 0
lxc.start.delay = 0

# Experiment-only: no autostart, no production service.