# The lifecycle's release phase, run where a container runtime exists.
#
# The phase refuses to run on the development host: "no container runtime
# (docker/podman) — release BLOCKS; the canonical hash must come from the
# recorded toolchain ..., never an ambient build (R5/R6)". That refusal is
# correct, and a runner has Docker, so this is the lane that earns the release
# receipt instead of a hand-cut tag: it gates on the verify sweep, re-derives
# the artifact hash inside the recorded image, bumps the component's version,
# re-pins `.host-software`, cuts the annotated tag and writes the receipt.
#
# The tag it pushes then triggers the component's own Release lane, which
# attaches the binary and the line that records its hash as release assets, so
# the bytes stay anonymously fetchable. This lane only does what the tool does;
# it commits and pushes the result.
#
# Dispatch it deliberately, one release at a time: the change class is how the
# tool maps to a version, and the authorization is the record that says why the
# release is owed.
name: Release phase

on:
  workflow_dispatch:
    inputs:
      change_class:
        description: "what the release changes, which the tool maps to a version"
        type: choice
        options:
          - neither
          - adds-flag
          - removes-flag
        default: neither
        required: true
      authorized:
        description: "the record that authorizes this release, as call/NNNN"
        type: string
        default: call/0034
        required: true

# It commits the phase's changes, pushes them, and cuts a tag.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the phase inspects the history it is about to tag
      # Two submodules, named, the way the reproducible lane does it: a
      # recursive checkout of every one of them wedged this job for fifteen
      # minutes with no log output on 2026-09-20. Both are load-bearing, and
      # the second one is not obvious: `tools/host-lifecycle` is the phase's
      # own tool, and `host-template` carries the adopted `lifecycle.manifest`
      # the tool resolves the phase list from. With the template absent the run
      # fails as "the adopted template has none (adopt/upgrade)", which is the
      # tool saying it cannot see the phase it is being asked to run.
      - name: Fetch the phase's tool and the adopted template
        run: git submodule update --init tools/host-lifecycle host-template
      - name: Build the release tool
        run: cargo build --release --manifest-path tools/host-lifecycle/Cargo.toml
      - name: Put the tool on the path the phase calls itself by
        run: echo "$PWD/tools/host-lifecycle/target/release" >> "$GITHUB_PATH"
      # The component is public, so materializing needs no credential; the
      # phase works in the component's worktree to bump its version and re-pin
      # the host's record against the commit that carries the bump.
      - name: Materialize the component
        run: host-lifecycle software --materialize .
      - name: Run the release phase
        run: |
          host-lifecycle release ds-lite-punch \
            --change-class "${{ inputs.change_class }}" \
            --authorized "${{ inputs.authorized }}"
      # The phase stops before the outward steps by design: it verifies the build, re-derives
      # the artifact digest, and prints the outward steps it authorizes. It does
      # not perform them, and this lane cannot either: the tag belongs to the
      # component, whose repository the host's token has no write access to, and
      # a long-lived token that could was retired when the component went public.
      # So the lane's product is the verified build and the exact steps, and the
      # operator runs them with a credential that reaches both repositories.
      - name: State what the release is, and what remains outward
        run: |
          {
            echo "### release phase"
            echo '```'
            grep -E "^	(pin|artifact)" .host-software || true
            echo "the phase's own outward steps are in the step above; this job performs none of them"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"