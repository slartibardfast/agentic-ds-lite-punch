name: Prose

# The spine obeys the prose rule it publishes (plan/0038): authored markdown carries
# zero prose tropes. `host-lifecycle prose .` is host-lint's `--docs` engine run
# in-process; it scans this repo's own tracked markdown (submodule files are gitlinks,
# not walked) and exits non-zero on any flag or warning.

on:
  push:
    branches: [main]
  pull_request:

# A pull request from a fork runs this job. The default token is read-only for
# a public repository, and saying so here keeps that true if the setting
# changes: the prose gate reads the tree and needs no write.
permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to the same host-lifecycle the host gates on (v0.53.0), so the spine's
      # prose verdict matches every adopter's verify audit; v0.49.0 embeds the
      # reconciled word-choice rules, under which this repository's own text is clean
      # with no LEXICON at all (call/0051). This is an equality claim and gates as
      # one, unlike a component's own CI pin, which declares a floor (call/0052).
      # --root $HOME/.local so the binary lands where the gate step reads it
      # (default cargo root is the toolchain bin dir, which is not this path).
      - name: Install host-lifecycle (pinned)
        run: cargo install --locked --root "$HOME/.local" --git https://github.com/connollydavid/host-lifecycle --rev 1686a6edd071c2e4d6b4ca74141be605f56dc8b5 # host-lifecycle, bumped by the release cascade
      - name: Prose gate (zero tropes in authored docs)
        run: "$HOME/.local/bin/host-lifecycle prose ."
